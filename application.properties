spring.application.name=smart-parking-web
server.port=${PORT:8080}
# Local runs use an in-memory H2 database. Set the three datasource variables for online PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartparking;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.sql.init.mode=never
spring.thymeleaf.cache=false
